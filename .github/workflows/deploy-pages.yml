# LoveHub — deploy to GitHub Pages
#
# GitHub Pages serves the repository directly, so the git-ignored
# supabase/config.js (which only exists in local/preview workspaces) would be
# missing. This workflow runs the production build FIRST — scripts/build.sh
# generates dist/supabase/config.js from SUPABASE_URL + SUPABASE_ANON_KEY —
# then publishes dist/ to Pages.
#
# Secrets are read from GitHub repository secrets (never committed):
#   Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       e.g. https://xxxxxxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  the public anon key (never the service_role key)
#
# After the first successful deploy, add to Supabase Auth → URL Configuration:
#   Site URL:     https://iphonesector-hash.github.io
#   Redirect URLs: https://iphonesector-hash.github.io/Lovehub.2/**

name: Deploy LoveHub to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production build
        run: sh ./scripts/build.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
